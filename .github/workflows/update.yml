name: Update dashboard

on:
  push:
    paths:
      - "social.json"
  schedule:
    # 台北 06:30 盤前（UTC 22:30 前一日）、12:00 盤中（UTC 04:00）、15:00 收盤後（UTC 07:00）
    - cron: "30 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同時觸發時排隊執行，避免兩個 run 互相搶推送
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "update dashboard $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          # 遠端若已被其他 run 推進，rebase 後重試。
          # 注意：rebase 時 -X theirs 才是「保留本次重播的新建置」，
          # -X ours 會反過來採用遠端舊版、把剛產生的頁面丟掉。
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase -X theirs origin main
          done
          git push
